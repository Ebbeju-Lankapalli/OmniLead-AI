[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "omnilead-ai-backend"
version = "0.1.0"
description = "FastAPI backend for OmniLead AI, an AI-powered omnichannel lead intelligence platform."
requires-python = ">=3.12,<3.13"


[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "alembic/versions",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ASYNC",
]

ignore = [
    "B008",
]


[tool.ruff.lint.isort]
known-first-party = ["app"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

asyncio_mode = "auto"

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

markers = [
    "unit: fast isolated unit tests",
    "integration: tests involving multiple application components",
    "api: FastAPI endpoint tests",
    "webhook: external webhook processing tests",
    "ai: AI workflow and structured-output tests",
]


[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "*/tests/*",
    "*/alembic/*",
]


[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]